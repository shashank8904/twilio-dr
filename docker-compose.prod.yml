services:
  backend:
    image: shashank8904/twilio-go-backend:latest
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/firebase-service-account.json
    volumes:
      - ./secrets:/secrets:ro
    networks:
      - dr-network

  frontend:
    image: shashank8904/twilio-go-frontend:latest
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - dr-network

networks:
  dr-network:
    driver: bridge
